services:
  - type: web
    name: aura-plus-mcp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: PORT
        value: 3000
      - key: BEDROCK_MODEL_ID
        value: anthropic.claude-3-5-sonnet-20240620-v1:0
      - key: AWS_REGION
        value: us-east-1
      # Optional AWS credentials (if not set, offline simulator handles all intents)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
